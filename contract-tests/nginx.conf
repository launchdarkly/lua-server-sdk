# The test service keeps its SDK clients in Lua memory, so it must run in one worker.
worker_processes 1;
error_log /dev/stderr info;

events {
    worker_connections 1024;
}

env SSL_CERT_FILE;

http {
    access_log off;

    lua_package_path "/usr/local/openresty/nginx/contract-tests/?.lua;;";

    # Keep request bodies in memory so that the service can read them with ngx.req.get_body_data.
    client_max_body_size 10m;
    client_body_buffer_size 10m;

    server {
        listen 8000;

        location / {
            content_by_lua_block {
                require("service").handle()
            }
        }
    }
}
