name: 'Install Lua SDK'
on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to install.'
        required: false
        type: choice
        options:
          - 'launchdarkly-server-sdk'
          - 'launchdarkly-server-sdk-redis'
        default: 'launchdarkly-server-sdk'
      version:
        description: 'Version to install. Default is latest.'
        required: false
        type: string

      lua-version:
        description: 'Lua version.'
        required: false
        type: choice
        options:
          - '5.1'
          - '5.2'
          - '5.3'
          - 'luajit-2.1'
        default: '5.3'
      cpp-sdk-version:
        description: "Version of the C++ Server-side SDK."
        required: false
        type: string
  workflow_call:
    inputs:
      package:
        required: false
        type: string
      version:
        required: false
        type: string
      lua-version:
        required: false
        type: string
      cpp-sdk-version:
        required: false
        type: string

env:
  PACKAGE: ${{ inputs.package == null && 'launchdarkly-server-sdk' || inputs.package }}
  VERSION: ${{ inputs.version == null && '' || inputs.version }}
  LUA_VERSION: ${{ inputs.lua-version == null && '5.3' || inputs.lua-version }}
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Lua
        uses: leafo/gh-actions-lua@32909a2dea0a48c433aec79e7fcd31b4cd55800f # v13.1.0
        with:
          luaVersion: ${{ env.LUA_VERSION }}

      - name: Install LuaRocks
        uses: leafo/gh-actions-luarocks@1c4a92caecc8f6850f673cbadfd57b3e555417ce # v6.1.1
        with:
          luarocksVersion: "3.13.0"

      - name: Install Boost
        id: install-boost
        uses: MarkusJx/install-boost@f9d34f6fe427b8f2ae424d7bf2a3ebccb0dae5a3 # v2.6.0
        with:
          boost_version: 1.81.0
          platform_version: "22.04"

      - name: Install CPP SDK
        uses: ./.github/actions/install-cpp-sdk-redis
        with:
          version: ${{ inputs.cpp-sdk-version }}
          path: cpp-sdk

      - name: Install Package
        shell: bash
        env:
          CPP_PATH: ${{ github.workspace }}/cpp-sdk/build-dynamic/release
        run: |
          luarocks install ${{ env.PACKAGE }} ${{ env.VERSION }} \
          LD_DIR=$CPP_PATH \
          LDREDIS_DIR=$CPP_PATH

      - name: Remove Package
        shell: bash
        run: luarocks remove ${{ env.PACKAGE }}
